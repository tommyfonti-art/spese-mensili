<!doctype html><html lang="it"><head><meta name="versione-app" content="2026-10-24b"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"><title>Spese del mese</title><link rel="apple-touch-icon" href="icon.png?v=2"><link rel="icon" href="icon.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spese"><meta name="theme-color" content="#C79B22"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"><style id="css">
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;}
:root{
  --bg:#EFEFEF; --surface:#FFFFFF; --ink:#161616; --muted:#5F6266; --line:#D6D6D8;
  --conto:#0F4C5C; --conto-ink:#FFFFFF; --conto-soft:#DAEAEC; --conto-text:#0F4C5C;
  --cont:#F2D9A0; --cont-ink:#3B2A05; --cont-soft:#F7EAC9; --cont-text:#7A4E00;

  --debt:#B3261E; --debt-ink:#FFFFFF; --debt-soft:#FBE3E1; --debt-text:#8C1C15;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1F1F1F; --ink:#ECECEC; --muted:#A0A3A7; --line:#34363A;
    --conto:#1F6E82; --conto-ink:#FFFFFF; --conto-soft:#1B3A42; --conto-text:#8FD0DE;
    --cont:#5A4514; --cont-ink:#FBEFD2; --cont-soft:#3D3116; --cont-text:#EBBE68;
    --danger:#F08A8A; --focus:#6BB8E8;
    --debt:#B4332B; --debt-ink:#FFFFFF; --debt-soft:#3A1A18; --debt-text:#F4A29B;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1F1F1F; --ink:#ECECEC; --muted:#A0A3A7; --line:#34363A;
  --conto:#1F6E82; --conto-ink:#FFFFFF; --conto-soft:#1B3A42; --conto-text:#8FD0DE;
  --cont:#5A4514; --cont-ink:#FBEFD2; --cont-soft:#3D3116; --cont-text:#EBBE68;
  --danger:#F08A8A; --focus:#6BB8E8;
    --debt:#B4332B; --debt-ink:#FFFFFF; --debt-soft:#3A1A18; --debt-text:#F4A29B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
.month{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,32px);letter-spacing:-.01em;text-align:center;margin:0}
.mid{flex:1;text-align:center}
.sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
.yr-btn{background:none;border:0;color:var(--conto-text);font-weight:600;font-size:13px;padding:8px 6px;min-height:40px}
.yr-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.yr-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:44px}

.yr-row .yn{display:flex;flex-direction:column}
.yr-row .yn b{font-family:var(--display);font-weight:700;font-size:16px}

.yr-row .ya{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}

.debts{margin:0 0 12px}
.debt-bar{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:8px 14px;background:var(--debt);color:var(--debt-ink);text-align:left;min-height:40px}

.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tot{display:block;width:100%;border:0;text-align:left;border-radius:20px;padding:16px}
.tot.conto{background:var(--conto);color:var(--conto-ink)}
.tot.cont{background:var(--cont);color:var(--cont-ink)}
.tot .lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:0 0 6px;opacity:.9}
.tot .plus{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:18px;line-height:1}
.tot .val{display:block;font-family:var(--display);font-weight:700;font-size:clamp(22px,6.4vw,30px);letter-spacing:-.02em;margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 6px 6px;color:var(--muted);font-size:15px}

.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px 4px 5px}

.trash svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.undo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.day{width:36px;height:32px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;border:1.5px solid var(--line)}
.day .dm{font-size:9px;font-weight:700;line-height:1;text-align:center;padding:2px 0 1px}
.day .dn{flex:1;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.day.conto{border-color:var(--conto)}
.day.conto .dm{background:var(--conto);color:var(--conto-ink)}
.day.conto .dn{background:var(--conto-soft);color:var(--conto-text)}
.day.cont{border-color:var(--cont)}
.day.cont .dm{background:var(--cont);color:var(--cont-ink)}
.day.cont .dn{background:var(--cont-soft);color:var(--cont-text)}
.name{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:11px;line-height:1.1;color:var(--muted);margin-top:0}
.tag{font-weight:600}
.tag.conto{color:var(--conto-text)}
.tag.cont{color:var(--cont-text)}
.amt{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:20px;margin-top:12px;color:var(--muted)}
.empty p{margin:0 0 12px}

.btn{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.more{display:flex;justify-content:center;margin-top:8px}
.quiet{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:12px 16px;min-height:44px;text-decoration:underline;text-underline-offset:3px}

.form{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--surface);border:2px solid var(--primary);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.form label,.form legend{font-size:14px;font-weight:600;color:var(--muted)}
.form select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:500;color:var(--ink)}
.form input[type=text],.form input[type=email],.form input[type=password]{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:500;color:var(--ink)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
fieldset{border:0;margin:0;padding:0}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.seg{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.seg span{display:block;text-align:center;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px}
.seg input:checked + span{background:var(--conto);border-color:var(--conto);color:var(--conto-ink)}
.seg.c input:checked + span{background:var(--cont);border-color:var(--cont);color:var(--cont-ink)}
.seg input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .primary{flex:1}
.status{margin-top:12px;font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.auth-t{font-family:var(--display);font-weight:700;font-size:20px;margin:0}
.note{margin:0;font-size:13px;color:var(--muted)}
.okm{margin:0;color:var(--conto-text);font-size:14px;font-weight:600}
.sect{margin:18px 0 0}
.sect h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
button:disabled{opacity:.6;cursor:default}
</style></head><body><div id="app"></div><script id="main">
(function(){
  var app = document.getElementById('app');
  var state = { items: [], debts: [], salaries: {} };

  var MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var MESI3 = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var START = 11; // il "mese" va dall'11 al 10 del mese dopo
  var eurFmt = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
  function eur(n){ return eurFmt.format(n); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function key(y, m){ return y + '-' + String(m + 1).padStart(2, '0'); }
  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var now = new Date();
  var cur = null;
  try { cur = sessionStorage.getItem('mese'); } catch(e) {}
  function periodOf(d){ var y = d.getFullYear(), m = d.getMonth(); if (d.getDate() < START) { m--; if (m < 0) { m = 11; y--; } } return key(y, m); }
  if (!/^\d{4}-\d{2}$/.test(cur || '')) cur = periodOf(now);

  var view = 'month'; // month | year
  var newPay = 'conto';
  var debtOpen = false;
  var debtEditing = null;  // null | 'new' | id
  var debtError = '';
  var armedDebt = false;
  var editing = null;      // null | 'new' | id
  var armedDelete = false;
  var storia = [];
  var formError = '';
  var saveState = 'idle';  // idle | pending | error

  function setMonth(k){
    cur = k; editing = null; armedDelete = false; formError = '';
    try { sessionStorage.setItem('mese', cur); } catch(e) {}
    render();
  }
  function shift(k, d){
    var p = k.split('-'), y = +p[0], m = +p[1] - 1 + d;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return key(y, m);
  }
  function label(k){ var p = k.split('-'); return MESI[+p[1] - 1] + ' ' + p[0]; }
  function range(k){
    var m = +k.split('-')[1] - 1;
    if (START === 1) return '1 ' + MESI3[m] + ' – fine ' + MESI3[m];
    return START + ' ' + MESI3[m] + ' – ' + (START - 1) + ' ' + MESI3[(m + 1) % 12];
  }
  function statoVuoto(){ return { items: [], debts: [], salaries: {}, startDay: 1 }; }
  function inizioValido(n){ return typeof n === 'number' && n >= 1 && n <= 28 && Math.floor(n) === n; }
  // legge dall'archivio il giorno di inizio del mese (chi non lo ha scelto mai ha l'11, come prima)
  function applicaInizio(){
    START = inizioValido(state.startDay) ? state.startDay : 11;
    var scelto = null;
    try { scelto = sessionStorage.getItem('mese'); } catch(e) {}
    if (!/^\d{4}-\d{2}$/.test(scelto || '')) cur = periodOf(new Date());
  }
  // cambia il giorno di inizio e sposta ogni spesa nel mese giusto, così resta alla sua data reale
  function cambiaInizioMese(nuovo){
    var vecchio = START;
    if (nuovo === vecchio) return;
    state.items.forEach(function(it){
      var p = it.m.split('-'), y = +p[0], mi = +p[1] - 1;
      var rm = it.day >= vecchio ? mi : mi + 1, ry = y;        // data reale con il vecchio inizio
      if (rm > 11) { rm = 0; ry++; }
      var pm = rm, py = ry;                                     // mese giusto con il nuovo inizio
      if (it.day < nuovo) { pm--; if (pm < 0) { pm = 11; py--; } }
      it.m = key(py, pm);
    });
    state.startDay = nuovo;
    START = nuovo;
    cur = periodOf(new Date());
    try { sessionStorage.setItem('mese', cur); } catch(e) {}
    editing = null; debtEditing = null;
    schedule();
  }
  function ord(day){ return day >= START ? day : day + 31; }
  function realMonth(k, day){ var m = +k.split('-')[1] - 1; return day >= START ? m : (m + 1) % 12; }

  function itemsOf(k){
    return state.items.filter(function(i){ return i.m === k; })
      .sort(function(a, b){ return (ord(a.day) - ord(b.day)) || a.name.localeCompare(b.name, 'it'); });
  }
  function candidates(){
    var names = {};
    itemsOf(cur).forEach(function(i){ names[i.name.toLowerCase()] = 1; });
    return itemsOf(shift(cur, -1)).filter(function(i){ return !names[i.name.toLowerCase()]; });
  }

  function parseAmount(v){
    var s = String(v).replace(/\s|€/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = parseFloat(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }

  function formHtml(it){
    var isNew = !it.id;
    return '<form class="form" data-form novalidate>' +
      '<label>Nome<input type="text" name="name" autocomplete="off" placeholder="es. Mutuo" value="' + esc(it.name || '') + '"></label>' +
      '<div class="two">' +
        '<label>Importo (€)<input type="text" name="amt" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + (it.amt ? esc(String(it.amt).replace('.', ',')) : '') + '"></label>' +
        '<label>Giorno di scadenza<input type="text" name="day" inputmode="numeric" autocomplete="off" placeholder="GG" value="' + esc(it.day || '') + '"></label>' +
      '</div>' +
      '<fieldset><legend>Come si paga</legend><div class="segs">' +
        '<label class="seg"><input type="radio" name="pay" value="conto"' + (it.pay !== 'contanti' ? ' checked' : '') + '><span>Banca</span></label>' +
        '<label class="seg c"><input type="radio" name="pay" value="contanti"' + (it.pay === 'contanti' ? ' checked' : '') + '><span>Contanti</span></label>' +
      '</div></fieldset>' +
      (formError ? '<p class="err" role="alert">' + esc(formError) + '</p>' : '') +
      '<div class="actions">' +
        '<button type="submit" class="btn primary">Salva</button>' +
        '<button type="button" class="btn" data-act="cancel">Annulla</button>' +
        (isNew ? '' : '<button type="button" class="btn danger" data-act="delete">Elimina</button>') +
      '</div>' +
      (isNew ? '' : '<div class="actions"><button type="button" class="btn" data-act="move" data-d="-1">‹ Mese prima<br><small>' + esc(label(shift(cur, -1))) + '</small></button><button type="button" class="btn" data-act="move" data-d="1">Mese dopo ›<br><small>' + esc(label(shift(cur, 1))) + '</small></button></div>') +
      '</form>';
  }

  function debtForm(d){
    return '<form class="form" data-debt-form novalidate>' +
      '<label>A chi devi dare i soldi<input type="text" name="name" autocomplete="off" placeholder="es. Meccanico" value="' + esc(d.name || '') + '"></label>' +
      '<label>Quanto devi ancora dare (€)<input type="text" name="amt" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + (d.amt ? esc(String(d.amt).replace('.', ',')) : '') + '"></label>' +
      (debtError ? '<p class="err" role="alert">' + esc(debtError) + '</p>' : '') +
      '<div class="actions"><button type="submit" class="btn primary">Salva</button>' +
      '<button type="button" class="btn" data-act="debt-cancel">Annulla</button>' +
      (d.id ? '<button type="button" class="btn danger" data-act="debt-done">' + (armedDebt ? 'Sicuro? Tocca ancora' : 'Saldato, toglilo') + '</button>' : '') +
      '</div></form>';
  }
  function debtHtml(){
    var ds = state.debts, total = 0;
    ds.forEach(function(d){ total += d.amt; });
    var line = !ds.length ? 'Nessun debito segnato' : (ds.length === 1 ? ds[0].name : ds.length + ' debiti');
    var h = '<div class="debts"><button class="debt-bar" data-act="debt-toggle" aria-expanded="' + (debtOpen ? 'true' : 'false') + '">' +
      '<span class="dl">Debiti</span><span class="dn2">' + esc(line) + '</span>' +
      '<span class="dt">' + (ds.length ? eur(total) : '') + '</span><span class="chev" aria-hidden="true">' + (debtOpen ? '▲' : '▼') + '</span></button>';
    if (debtOpen) {
      h += '<div class="debt-panel">';
      ds.forEach(function(d){
        if (debtEditing === d.id) { h += debtForm(d); return; }
        h += '<button class="debt-row" data-act="debt-edit" data-id="' + esc(d.id) + '"><span class="n">' + esc(d.name) + '</span><span class="a">' + eur(d.amt) + '</span></button>';
      });
      if (debtEditing === 'new') h += debtForm({});
      else h += '<button class="btn wide" data-act="debt-add">Aggiungi debito</button>';
      if (ds.length && debtEditing !== 'new') h += '<p class="debt-note">Se ne paghi solo una parte, tocca il debito e scrivi quanto ti resta.</p>';
      h += '</div>';
    }
    return h + '</div>';
  }

  function yearRows(){
    var h = '';
    for (var i = 0; i < 12; i++) {
      var k = i === 0 ? cur : shift(cur, i);
      var tot = 0;
      itemsOf(k).forEach(function(it){ tot += it.amt; });
      h += '<li><button class="yr-row' + (k === cur ? ' cur' : '') + '" data-act="yr-pick" data-k="' + esc(k) + '">' +
        '<span class="yn"><b>' + esc(label(k)) + '</b><span>' + esc(range(k)) + '</span></span>' +
        '<span class="ya">' + eur(tot) + '</span></button></li>';
    }
    return h;
  }

  function render(){
    if (!sessione) { renderAccesso(); return; }
    if (view === 'impostazioni') { renderImpostazioni(); return; }
    if (view === 'year') {
      var h2 = '<header class="top">' +
        '<div class="mid"><h1 class="month">Prossimi 12 mesi</h1><p class="sub">Quanto hai già segnato per ognuno</p></div>' +
        '</header>' +
        '<button class="yr-btn" data-act="view-month">‹ Torna al mese</button>' +
        '<ul class="yr-list">' + yearRows() + '</ul>';
      app.innerHTML = h2;
      return;
    }
    var items = itemsOf(cur);

  var rinnovo = null;
  function getToken(forza){
    if(!sessione){ var e0 = new Error('no-session'); e0.code = 'no-session'; return Promise.reject(e0); }
    if(!forza && sessione.scade - Date.now() > 60000) return Promise.resolve(sessione.idToken);
    if(rinnovo) return rinnovo;
    var corpo = 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sessione.refreshToken);
    rinnovo = fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: corpo
    }).then(function(res){
      return res.json().then(function(j){
        if(!res.ok){ var e = new Error('refresh'); e.code = (j && j.error && j.error.message) || 'error'; throw e; }
        return j;
      });
    }, function(){
      var en = new Error('network'); en.code = 'network'; throw en;
    }).then(function(j){
      var nuova = {
        idToken: j.id_token, refreshToken: j.refresh_token, uid: j.user_id || sessione.uid,
        email: sessione.email,
        scade: Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000

    }, function(err){
      rinnovo = null;
      var c = err && err.code;
      if(c === 'TOKEN_EXPIRED' || c === 'INVALID_REFRESH_TOKEN' || c === 'USER_NOT_FOUND' || c === 'USER_DISABLED'){ esciSubito(); }
      throw err;
    });
    return rinnovo;
  }

  function fsFetch(path, opts, ms, secondaVolta){
    opts = opts || {};
    var sep = path.indexOf('?') > -1 ? '&' : '?';
    var url = API_BASE + path + sep + 'key=' + API_KEY;
    return getToken().then(function(token){
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, ms || 12000);
      var headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + token });
      return fetch(url, Object.assign({}, opts, { headers: headers, signal: ctrl.signal }))
        .then(function(res){
          clearTimeout(timer);
          if(!res.ok){
            if(res.status === 404){ var e404 = new Error('not-found'); e404.code = 'not-found'; throw e404; }
            if((res.status === 401 || res.status === 403) && !secondaVolta){
              return getToken(true).then(function(){ return fsFetch(path, opts, ms, true); });
            }
            if(res.status === 401 || res.status === 403){ var e403 = new Error('permission-denied'); e403.code = 'permission-denied'; throw e403; }
            if(res.status === 429){ var e429 = new Error('resource-exhausted'); e429.code = 'resource-exhausted'; throw e429; }
            var eOther = new Error('http-'+res.status); eOther.code = 'error'; throw eOther;
          }
          return res.status === 204 ? null : res.json();
        })
        .catch(function(err){
          clearTimeout(timer);
          if(err && err.code) throw err;
          if(err && err.name === 'AbortError'){ var eT = new Error('timeout'); eT.code = 'timeout'; throw eT; }
          var eN = new Error('network'); eN.code = 'network'; throw eN;
        });
    });
  }

  function inviaAuth(form){

    var email = form.elements.email.value.trim();
    var pw = form.elements.password ? form.elements.password.value : '';
    var pw2 = form.elements.password2 ? form.elements.password2.value : '';
    authEmail = email; authMsg = null;
    if (!email) { authMsg = { tipo: 'err', testo: 'Scrivi la tua email.' }; renderAccesso(); return; }
    if (authMode === 'reset') {
      authBusy = true; renderAccesso();
      authPost('sendOobCode', { requestType: 'PASSWORD_RESET', email: email }).then(function(){
        authBusy = false;
        authMsg = { tipo: 'ok', testo: 'Fatto. Se questa email è iscritta, tra poco ti arriva un messaggio con il link. Controlla anche la posta indesiderata.' };
        renderAccesso();
      }).catch(function(err){
        authBusy = false; authMsg = { tipo: 'err', testo: erroreAuth(err && err.code) }; renderAccesso();
      });
      return;
    }
    if (!pw) { authMsg = { tipo: 'err', testo: 'Scrivi la password.' }; renderAccesso(); return; }
    if (authMode === 'iscriviti') {
      if (pw.length < 8) { authMsg = { tipo: 'err', testo: 'La password deve avere almeno 8 caratteri.' }; renderAccesso(); return; }
      if (pw !== pw2) { authMsg = { tipo: 'err', testo: 'Le due password non coincidono.' }; renderAccesso(); return; }
    }
    authBusy = true; renderAccesso();
    authPost(authMode === 'iscriviti' ? 'signUp' : 'signInWithPassword', { email: email, password: pw, returnSecureToken: true }).then(function(j){
      salvaSessione(sessioneDa(j, email));
      authBusy = false; authMsg = null; authEmail = '';
      state = statoVuoto();
      applicaInizio();
      view = 'month'; saveState = 'idle'; importTentato = false;
      render();
      caricaRemoto();

  }

    h += '<section class="sect"><h2>Cambia password</h2><form class="form" data-cambia novalidate>' +
      '<label>Password attuale<input type="password" name="vecchia" autocomplete="current-password"></label>' +
      '<label>Nuova password<input type="password" name="nuova" autocomplete="new-password"></label>' +
      '<label>Ripeti la nuova password<input type="password" name="nuova2" autocomplete="new-password"></label>' +
      '<p class="note">Almeno 8 caratteri.</p>' + msgHtml('cambia') +
      '<div class="actions"><button type="submit" class="btn primary">Cambia password</button></div></form></section>';
    h += '<section class="sect"><h2>Password dimenticata</h2><p class="sub" style="margin:0 0 8px">Ti mandiamo per email un link per sceglierne una nuova.</p>' +
      msgHtml('link') + '<button class="btn wide" data-act="set-link">Mandami il link per email</button></section>';
    h += '<section class="sect"><button class="btn wide" data-act="set-esci">Esci da questo dispositivo</button></section>';
    h += '<section class="sect"><h2>Elimina account</h2>';
    if (!armedElimina) {
      h += '<p class="sub" style="margin:0 0 8px">Cancella per sempre il tuo account e tutte le tue spese.</p><button class="btn wide danger" data-act="set-elimina">Elimina il mio account</button>';
    } else {
      h += '<form class="form" data-elimina novalidate><p class="err">Stai per cancellare tutto, senza possibilità di tornare indietro.</p>' +
        '<label>Scrivi la password per confermare<input type="password" name="pw" autocomplete="current-password"></label>' + msgHtml('elimina') +
        '<div class="actions"><button type="submit" class="btn danger">Elimina per sempre</button><button type="button" class="btn" data-act="set-annulla">Annulla</button></div></form>';
    }
    h += '</section>';
    app.innerHTML = h;
  }

  function cambiaPassword(form){
    var vecchia = form.elements.vecchia.value, nuova = form.elements.nuova.value, nuova2 = form.elements.nuova2.value;
    if (!vecchia) { setMsg = { sez: 'cambia', tipo: 'err', testo: 'Scrivi la password attuale.' }; render(); return; }
    if (nuova.length < 8) { setMsg = { sez: 'cambia', tipo: 'err', testo: 'La nuova password deve avere almeno 8 caratteri.' }; render(); return; }
    if (nuova !== nuova2) { setMsg = { sez: 'cambia', tipo: 'err', testo: 'Le due password nuove non coincidono.' }; render(); return; }
    authPost('signInWithPassword', { email: sessione.email, password: vecchia, returnSecureToken: true }).then(function(j){
      return authPost('update', { idToken: j.idToken, password: nuova, returnSecureToken: true });
    }).then(function(j2){
      salvaSessione(sessioneDa(j2, sessione.email));
      setMsg = { sez: 'cambia', tipo: 'ok', testo: 'Password cambiata.' };
      render();
    }).catch(function(err){
      var c = String((err && err.code) || '');
      var t = (c.indexOf('INVALID_LOGIN_CREDENTIALS') === 0 || c.indexOf('INVALID_PASSWORD') === 0) ? 'La password attuale è sbagliata.' : erroreAuth(c);
      setMsg = { sez: 'cambia', tipo: 'err', testo: t };
      render();
    });
  }
  function mandaLink(){
    authPost('sendOobCode', { requestType: 'PASSWORD_RESET', email: sessione.email }).then(function(){
      setMsg = { sez: 'link', tipo: 'ok', testo: 'Fatto. Controlla la tua email (anche la posta indesiderata).' };
      render();
    }).catch(function(err){
      setMsg = { sez: 'link', tipo: 'err', testo: erroreAuth(err && err.code) };
      render();
    });
  }
  function eliminaAccount(form){
    var pw = form.elements.pw.value;
    if (!pw) { setMsg = { sez: 'elimina', tipo: 'err', testo: 'Scrivi la password per confermare.' }; render(); return; }
    authPost('signInWithPassword', { email: sessione.email, password: pw, returnSecureToken: true }).then(function(j){
      salvaSessione(sessioneDa(j, sessione.email));
      // prima si cancellano le spese, poi l'account
      return fsFetch(DOC_PATH, { method: 'DELETE' }, 12000).catch(function(err){
        if (err && err.code === 'not-found') return null;
        throw err;
      });
    }).then(function(){
      return authPost('delete', { idToken: sessione.idToken });
    }).then(function(){
      esciSubito();
      authMsg = { tipo: 'ok', testo: 'Il tuo account e le tue spese sono stati eliminati.' };
      render();
    }).catch(function(err){
      var c = String((err && err.code) || '');
      var t = (c.indexOf('INVALID_LOGIN_CREDENTIALS') === 0 || c.indexOf('INVALID_PASSWORD') === 0) ? 'La password è sbagliata.' : erroreAuth(c);
      setMsg = { sez: 'elimina', tipo: 'err', testo: t };
      render();
    });
  }

  var pollTimer = null;
  function initStorage(){
    salvaSessione(leggiSessione());
    render();
    if (sessione) caricaRemoto();
    pollTimer = setInterval(function(){
      if (!sessione) return;
      if ((pendingSave || saveState === 'pending') && !migrazioneInSospeso) return;
      if (editing || debtEditing) return;
      caricaRemoto();
    }, 6000);
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) flush();
  });
  window.addEventListener('pagehide', function(){ flush(); });
  window.addEventListener('blur', function(){ flush(); });

  // ---- interazioni ----
  app.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'auth-reset') { authMode = 'reset'; authMsg = null; renderAccesso(); return; }
    if (act === 'auth-iscriviti') { authMode = 'iscriviti'; authMsg = null; renderAccesso(); return; }
    if (act === 'auth-accedi') { authMode = 'accedi'; authMsg = null; renderAccesso(); return; }
    if (act === 'set-open') { view = 'impostazioni'; setMsg = null; armedElimina = false; render(); return; }
    if (act === 'set-back') { view = 'month'; setMsg = null; armedElimina = false; render(); return; }
    if (act === 'set-link') { mandaLink(); return; }
    if (act === 'set-esci') { esciSubito(); return; }
    if (act === 'set-elimina') { armedElimina = true; setMsg = null; render(); return; }
    if (act === 'set-annulla') { armedElimina = false; setMsg = null; render(); return; }
    if (act === 'view-year') { view = 'year'; render(); return; }
    if (act === 'view-month') { view = 'month'; render(); return; }
    if (act === 'yr-pick') { cur = t.getAttribute('data-k'); try { sessionStorage.setItem('mese', cur); } catch(e) {} view = 'month'; render(); return; }
    if (act === 'debt-toggle') {
      debtOpen = !debtOpen; if (!debtOpen) { debtEditing = null; armedDebt = false; debtError = ''; }
      render();
    }
    else if (act === 'debt-add') { debtEditing = 'new'; debtError = ''; armedDebt = false; render(); }
    else if (act === 'debt-edit') { debtEditing = t.getAttribute('data-id'); debtError = ''; armedDebt = false; render(); }
    else if (act === 'debt-cancel') { debtEditing = null; debtError = ''; armedDebt = false; render(); }
    else if (act === 'debt-done') {
      if (!armedDebt) { armedDebt = true; render(); return; }
      state.debts = state.debts.filter(function(d){ return d.id !== debtEditing; });
      debtEditing = null; armedDebt = false; debtOpen = false; schedule(); render();
    }
    else if (act === 'today') setMonth(periodOf(new Date()));
    else if (act === 'prev') setMonth(shift(cur, -1));
    else if (act === 'next') setMonth(shift(cur, 1));
    else if (act === 'add') { newPay = t.getAttribute('data-pay') === 'contanti' ? 'contanti' : 'conto'; editing = 'new'; formError = ''; armedDelete = false; render(); }
    else if (act === 'edit') { editing = t.getAttribute('data-id'); formError = ''; armedDelete = false; render(); }
    else if (act === 'cancel') { editing = null; formError = ''; armedDelete = false; render(); }
    else if (act === 'copy') {
      candidates().forEach(function(i){ state.items.push({ id: newId(), m: cur, name: i.name, amt: i.amt, day: i.day, pay: i.pay }); });
      schedule(); render();
    }
    else if (act === 'move') {
      var dd = parseInt(t.getAttribute('data-d'), 10) === 1 ? 1 : -1;
      var mv = state.items.filter(function(i){ return i.id === editing; })[0];
      if (!mv) return;
      storia.push({ t: 'sposta', id: mv.id, m: mv.m }); if (storia.length > 30) storia.shift();
      mv.m = shift(mv.m, dd);
      editing = null; formError = ''; armedDelete = false; schedule(); render();
    }
    else if (act === 'trash') {
      var tid = t.getAttribute('data-id');
      var gone = state.items.filter(function(i){ return i.id === tid; })[0];
      if (!gone) return;
      state.items = state.items.filter(function(i){ return i.id !== tid; });
      storia.push({ t: 'elimina', item: gone }); if (storia.length > 30) storia.shift();
      schedule(); render();
    }
    else if (act === 'undo') {
      var az = storia.pop();
      if (!az) return;
      if (az.t === 'elimina') { state.items.push(az.item); cur = az.item.m; }
      else if (az.t === 'sposta') {
        var it2 = state.items.filter(function(i){ return i.id === az.id; })[0];
        if (it2) { it2.m = az.m; cur = az.m; }
      }
      editing = null; schedule(); render();
    }
    else if (act === 'delete') {
      var gone2 = state.items.filter(function(i){ return i.id === editing; })[0];
      if (gone2) { storia.push({ t: 'elimina', item: gone2 }); if (storia.length > 30) storia.shift(); }
      state.items = state.items.filter(function(i){ return i.id !== editing; });
      editing = null; armedDelete = false; schedule(); render();
    }
  });

  app.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (ev.target.hasAttribute('data-auth')) { inviaAuth(ev.target); return; }
    if (ev.target.hasAttribute('data-inizio')) {
      var g2 = parseInt(ev.target.elements.giorno.value, 10);
      if (!(g2 >= 1 && g2 <= 28)) { setMsg = { sez: 'inizio', tipo: 'err', testo: 'Scegli un giorno tra 1 e 28.' }; render(); return; }
      var cambia = g2 !== START;
      cambiaInizioMese(g2);
      setMsg = { sez: 'inizio', tipo: 'ok', testo: cambia ? 'Fatto. Le tue spese sono rimaste alle loro date. Il mese in corso ora va: ' + range(periodOf(new Date())) : 'Il giorno è già questo, non cambia niente.' };
      render();
      return;
    }
    if (ev.target.hasAttribute('data-cambia')) { cambiaPassword(ev.target); return; }
    if (ev.target.hasAttribute('data-elimina')) { eliminaAccount(ev.target); return; }
    if (ev.target.hasAttribute('data-debt-form')) {
      var fd = ev.target;
      var dn = fd.elements.name.value.trim(), rawA = fd.elements.amt.value, da = parseAmount(rawA);
      if (!dn) debtError = 'Scrivi a chi devi dare i soldi.';
      else if (!(da > 0)) debtError = 'Scrivi quanto devi ancora dare, ad esempio 300.';
      else debtError = '';
      if (debtError) {
        render();
        var f2 = app.querySelector('[data-debt-form]');
        if (f2) { f2.elements.name.value = dn; f2.elements.amt.value = rawA; }
        return;
      }
      if (debtEditing === 'new') state.debts.push({ id: newId(), name: dn, amt: da });
      else state.debts.forEach(function(d){ if (d.id === debtEditing) { d.name = dn; d.amt = da; } });
      debtEditing = null; armedDebt = false; debtOpen = false; schedule(); render();
      return;
    }
    var f = ev.target;
    var name = f.elements.name.value.trim();
    var amt = parseAmount(f.elements.amt.value);
    var day = parseInt(f.elements.day.value, 10);
    var pay = f.elements.pay.value === 'contanti' ? 'contanti' : 'conto';
    if (!name) formError = 'Scrivi il nome della spesa.';
    else if (!(amt > 0)) formError = 'Scrivi un importo, ad esempio 450,00.';
    else if (!(day >= 1 && day <= 31)) formError = 'Il giorno deve essere tra 1 e 31.';
    else formError = '';
    if (formError) {
      var rawAmt = f.elements.amt.value, rawDay = f.elements.day.value;
      render();
      var ff = app.querySelector('[data-form]');
      if (ff) {
        ff.elements.name.value = name; ff.elements.amt.value = rawAmt; ff.elements.day.value = rawDay;
        ff.querySelector('input[value=' + pay + ']').checked = true;
      }
      return;
    }
    if (editing === 'new') {
      state.items.push({ id: newId(), m: cur, name: name, amt: amt, day: day, pay: pay });
    } else {
      state.items.forEach(function(i){ if (i.id === editing) { i.name = name; i.amt = amt; i.day = day; i.pay = pay; } });
    }
    editing = null; armedDelete = false;
    schedule(); render();
  });

  initStorage();
})();
</script><script>(function(){var b=function(e){e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(function(n){document.addEventListener(n,b,{passive:false})});var t=0;document.addEventListener("touchend",function(e){var n=Date.now();if(n-t<350&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="SELECT"){e.preventDefault()}t=n},{passive:false});document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault()},{passive:false})})();</script><script>
/* aggiornamento automatico: se su GitHub c'è una versione nuova dell'app, la ricarico da sola.
   La versione è nel tag <meta name="versione-app"> in alto: va cambiata a ogni modifica. */
(function(){
  try{
    var mia = (document.querySelector('meta[name="versione-app"]')||{}).content;
    if(!mia || !window.fetch || location.protocol.indexOf('http')!==0) return;
    var inCorso = false;
    function occupato(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
    function controlla(){
      if(inCorso || document.hidden) return;
      inCorso = true;
      fetch(location.pathname + '?c=' + Date.now(), { cache:'no-store' })
        .then(function(r){ return r.ok ? r.text() : ''; })
        .then(function(t){
          inCorso = false;
          var m = t && t.match(/<meta name="versione-app" content="([^"]+)"/);
          if(!m || m[1] === mia) return;
          if(occupato()) return;
          var chiave = 'agg_' + m[1];
          try{ if(sessionStorage.getItem(chiave)) return; sessionStorage.setItem(chiave, '1'); }catch(e){}
          try{ window.dispatchEvent(new Event('pagehide')); }catch(e){}
          setTimeout(function(){ location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])); }, 500);
        })
        .catch(function(){ inCorso = false; });
    }
    setTimeout(controlla, 1500);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(controlla, 700); });
    setInterval(controlla, 300000);
  }catch(e){}
})();
</script>
