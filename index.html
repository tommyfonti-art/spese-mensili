    var s = String(v).replace(/\s|€/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = parseFloat(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }

  function authPost(metodo, corpo){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 15000);
    return fetch(AUTH_BASE + metodo + '?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Firebase-Locale': 'it' },

    }).then(function(res){
      clearTimeout(timer);
      return res.json().then(function(j){
        if(!res.ok){ var e = new Error('auth'); e.code = (j && j.error && j.error.message) || 'error'; throw e; }
        return j;
      }, function(){
        if(!res.ok){ var e2 = new Error('auth'); e2.code = 'error'; throw e2; }
        return {};
      });
    }, function(){
      clearTimeout(timer);
      var en = new Error('network'); en.code = 'network'; throw en;
    });
  }

  var rinnovo = null;
  function getToken(forza){
    if(!sessione){ var e0 = new Error('no-session'); e0.code = 'no-session'; return Promise.reject(e0); }
    if(!forza && sessione.scade - Date.now() > 60000) return Promise.resolve(sessione.idToken);
    if(rinnovo) return rinnovo;
    var corpo = 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sessione.refreshToken);
    rinnovo = fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: corpo
    }).then(function(res){
      return res.json().then(function(j){
        if(!res.ok){ var e = new Error('refresh'); e.code = (j && j.error && j.error.message) || 'error'; throw e; }
        return j;
      });
    }, function(){
      var en = new Error('network'); en.code = 'network'; throw en;
    }).then(function(j){
      var nuova = {
        idToken: j.id_token, refreshToken: j.refresh_token, uid: j.user_id || sessione.uid,
        email: sessione.email,
        scade: Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000
      };
      salvaSessione(nuova);
      rinnovo = null;
      return nuova.idToken;
    }, function(err){
      rinnovo = null;
      var c = err && err.code;
      if(c === 'TOKEN_EXPIRED' || c === 'INVALID_REFRESH_TOKEN' || c === 'USER_NOT_FOUND' || c === 'USER_DISABLED'){ esciSubito(); }
      throw err;
    });
    return rinnovo;
  }

  function fsFetch(path, opts, ms, secondaVolta){
    opts = opts || {};
    var sep = path.indexOf('?') > -1 ? '&' : '?';
    var url = API_BASE + path + sep + 'key=' + API_KEY;
    return getToken().then(function(token){
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, ms || 12000);
      var headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + token });
      return fetch(url, Object.assign({}, opts, { headers: headers, signal: ctrl.signal }))
        .then(function(res){
          clearTimeout(timer);
          if(!res.ok){
            if(res.status === 404){ var e404 = new Error('not-found'); e404.code = 'not-found'; throw e404; }
            if((res.status === 401 || res.status === 403) && !secondaVolta){
              return getToken(true).then(function(){ return fsFetch(path, opts, ms, true); });
            }
            if(res.status === 401 || res.status === 403){ var e403 = new Error('permission-denied'); e403.code = 'permission-denied'; throw e403; }
            if(res.status === 429){ var e429 = new Error('resource-exhausted'); e429.code = 'resource-exhausted'; throw e429; }
            var eOther = new Error('http-'+res.status); eOther.code = 'error'; throw eOther;
          }
          return res.status === 204 ? null : res.json();
        })
        .catch(function(err){
          clearTimeout(timer);
          if(err && err.code) throw err;
          if(err && err.name === 'AbortError'){ var eT = new Error('timeout'); eT.code = 'timeout'; throw eT; }
          var eN = new Error('network'); eN.code = 'network'; throw eN;
        });
    });
  }

        try{
          var parsed = JSON.parse(raw);

            if (!Array.isArray(parsed.debts)) parsed.debts = [];
            if (!parsed.salaries || typeof parsed.salaries !== 'object') parsed.salaries = {};

            if (!Array.isArray(parsed.monthly)) parsed.monthly = [];
            if (!inizioValido(parsed.startDay)) parsed.startDay = 11;
            state = parsed;
            applicaInizio();
            controllaGuida();
            render();
          }
        }catch(e){ /* ignore */ }
      }
    }).catch(function(err){
      if(err && err.code === 'not-found'){

        if(VUOLE_IMPORTARE && !importTentato) importaVecchi();

        else { controllaGuida(); if (guida) render(); }

      var po = raw ? JSON.parse(raw) : null;
      if(!po || typeof po !== 'object' || !Array.isArray(po.items)){ var ef = new Error('formato'); ef.code = 'formato'; throw ef; }

      var ids = {}; po.items.forEach(function(i){ ids[i.id] = true; });
      var idd = {}; po.debts.forEach(function(d){ idd[d.id] = true; });

  }
  // salva nella guida quello che è scritto nei campi, prima di ridisegnare
  function leggiGuida(){
    var f = app.querySelector('[data-guida]');
    if (!f || !guida) return;
    if (guida.passo === 1 && f.elements.giornoG) guida.giorno = parseInt(f.elements.giornoG.value, 10) || 1;
    if (guida.passo === 2) {
      guida.righe = [].map.call(f.querySelectorAll('[data-riga]'), function(el){
        var ck = el.querySelector('input[type=radio]:checked');
        return { id: el.getAttribute('data-riga'), name: el.querySelector('[name=name]').value, amt: el.querySelector('[name=amt]').value,
          day: el.querySelector('[name=day]').value, pay: ck ? ck.value : 'conto' };
      });
    }
  }
  function avantiGuida(){
    leggiGuida();
    var g = guida;
    if (g.passo === 2) {
      var out = [], err = '';
      for (var i = 0; i < g.righe.length; i++) {
        var r = g.righe[i], n = r.name.trim(), a = parseAmount(r.amt), d = parseInt(r.day, 10);
        if (!n && !String(r.amt).trim() && !String(r.day).trim()) continue;
        if (!n) { err = 'Scrivi il nome di ogni spesa, oppure toglila.'; break; }
        if (!(a > 0)) { err = 'Scrivi l\'importo di «' + n + '», ad esempio 450,00.'; break; }
        if (!(d >= 1 && d <= 31)) { err = 'Il giorno di «' + n + '» deve essere tra 1 e 31.'; break; }
        out.push({ id: newId(), name: n, amt: a, day: d, pay: r.pay === 'contanti' ? 'contanti' : 'conto' });
      }
      g.err = err;
      if (err) { render(); return; }
      g.finali = out;
    }
    g.passo++;
    render();
    window.scrollTo(0, 0);
  }
  function chiudiGuida(salta){
    var g = guida;
    if (!salta && g) {
      if (g.giorno !== START) cambiaInizioMese(g.giorno);
      else state.startDay = START;
      if (!state.monthly) state.monthly = [];
      var da = periodOf(new Date());
      g.finali.forEach(function(r){ state.monthly.push({ id: r.id, name: r.name, amt: r.amt, day: r.day, pay: r.pay, from: da, done: {} }); });
    }
    state.guidaFatta = true;

  var pollTimer = null;

    salvaSessione(leggiSessione());

      if (!sessione) return;

  document.addEventListener('visibilitychange', function(){

  window.addEventListener('pagehide', function(){ flush(); });

  // ---- interazioni ----
  app.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'auth-reset') { authMode = 'reset'; authMsg = null; renderAccesso(); return; }
    if (act === 'auth-iscriviti') { authMode = 'iscriviti'; authMsg = null; renderAccesso(); return; }
    if (act === 'auth-accedi') { authMode = 'accedi'; authMsg = null; renderAccesso(); return; }

    if (act === 'rec-add') { recEditing = 'new'; recError = ''; armedRec = false; render(); return; }

    if (act === 'rec-delete') { if (!armedRec) { armedRec = true; render(); return; } eliminaRicorrente(); return; }

      var wid = t.getAttribute('data-id'), oggiW = periodOf(new Date());
      state.weekly = (state.weekly || []).filter(function(r){ return r.id !== wid; });
      state.items = state.items.filter(function(i){ return !(i.r === wid && i.m >= oggiW); });

    }

    if (act === 'g-indietro') { leggiGuida(); if (guida.passo > 0) guida.passo--; guida.err = ''; render(); window.scrollTo(0, 0); return; }
    if (act === 'g-fine') { chiudiGuida(false); return; }
    if (act === 'g-chip') {
      leggiGuida();
      guida.righe.push({ id: newId(), name: SUGGERITE[parseInt(t.getAttribute('data-n'), 10)] || '', amt: '', day: '', pay: 'conto' });
      guida.err = ''; render();
      var ult = app.querySelectorAll('[data-riga]'); ult = ult[ult.length - 1];
      if (ult) { var ia = ult.querySelector('[name=amt]'); if (ia) { try { ia.focus({ preventScroll: true }); } catch(e) {} ult.scrollIntoView({ block: 'center' }); } }
      return;
    }
    if (act === 'g-aggiungi') {
      leggiGuida();
      guida.righe.push({ id: newId(), name: '', amt: '', day: '', pay: 'conto' });

      var ult2 = app.querySelectorAll('[data-riga]'); ult2 = ult2[ult2.length - 1];
      if (ult2) { var inm = ult2.querySelector('[name=name]'); if (inm) { try { inm.focus({ preventScroll: true }); } catch(e) {} ult2.scrollIntoView({ block: 'center' }); } }
      return;

      guida.err = ''; render(); return;
    }
    if (act === 'set-open') { view = 'impostazioni'; setMsg = null; armedElimina = false; render(); return; }
    if (act === 'set-back') { view = 'month'; setMsg = null; armedElimina = false; render(); return; }
    if (act === 'set-link') { mandaLink(); return; }
    if (act === 'set-esci') { esciSubito(); return; }
    if (act === 'set-elimina') { armedElimina = true; setMsg = null; render(); return; }
    if (act === 'set-annulla') { armedElimina = false; setMsg = null; render(); return; }

    if (act === 'view-month') { view = 'month'; render(); return; }

    else if (act === 'debt-cancel') { debtEditing = null; debtError = ''; armedDebt = false; render(); }

      if (!armedDebt) { armedDebt = true; render(); return; }
      state.debts = state.debts.filter(function(d){ return d.id !== debtEditing; });
      debtEditing = null; armedDebt = false; debtOpen = false; schedule(); render();
    }
    else if (act === 'today') setMonth(periodOf(new Date()));
    else if (act === 'prev') setMonth(shift(cur, -1));
    else if (act === 'next') setMonth(shift(cur, 1));
    else if (act === 'add') { newPay = t.getAttribute('data-pay') === 'contanti' ? 'contanti' : 'conto'; editing = 'new'; formError = ''; armedDelete = false; render(); }
    else if (act === 'edit') { editing = t.getAttribute('data-id'); formError = ''; armedDelete = false; render(); }
    else if (act === 'cancel') { editing = null; formError = ''; armedDelete = false; render(); }
    else if (act === 'copy') {
      candidates().forEach(function(i){ if (i.r || i.rm) return; state.items.push({ id: newId(), m: cur, name: i.name, amt: i.amt, day: i.day, pay: i.pay }); });
      schedule(); render();
    }
    else if (act === 'move') {
      var dd = parseInt(t.getAttribute('data-d'), 10) === 1 ? 1 : -1;
      var mv = state.items.filter(function(i){ return i.id === editing; })[0];
      if (!mv) return;
      storia.push({ t: 'sposta', id: mv.id, m: mv.m }); if (storia.length > 30) storia.shift();
      mv.m = shift(mv.m, dd);
      editing = null; formError = ''; armedDelete = false; schedule(); render();
    }
    else if (act === 'trash') {
      var tid = t.getAttribute('data-id');
      var gone = state.items.filter(function(i){ return i.id === tid; })[0];
      if (!gone) return;
      state.items = state.items.filter(function(i){ return i.id !== tid; });
      storia.push({ t: 'elimina', item: gone }); if (storia.length > 30) storia.shift();
      schedule(); render();
    }
    else if (act === 'undo') {
      var az = storia.pop();
      if (!az) return;
      if (az.t === 'elimina') { state.items.push(az.item); cur = az.item.m; }
      else if (az.t === 'sposta') {
        var it2 = state.items.filter(function(i){ return i.id === az.id; })[0];
        if (it2) { it2.m = az.m; cur = az.m; }
      }
      editing = null; schedule(); render();
    }
    else if (act === 'stop-rep') {
      var cu = state.items.filter(function(i){ return i.id === editing; })[0];
      if (!cu || !(cu.r || cu.rm)) return;

      if (gone2) { storia.push({ t: 'elimina', item: gone2 }); if (storia.length > 30) storia.shift(); }

  app.addEventListener('submit', function(ev){

    if (ev.target.hasAttribute('data-debt-form')) {
      var fd = ev.target;
      var dn = fd.elements.name.value.trim(), rawA = fd.elements.amt.value, da = parseAmount(rawA);
      if (!dn) debtError = 'Scrivi a chi devi dare i soldi.';

  // mostra/nasconde giorno o giorno della settimana e scrive che giorno è la data digitata
  function mostraAvviso(form){

  }
  app.addEventListener('input', function(ev){ var fm = ev.target.closest && ev.target.closest('[data-form]'); if (fm) mostraAvviso(fm); });
  app.addEventListener('change', function(ev){
    var fm = ev.target.closest && ev.target.closest('[data-form]'); if (fm) mostraAvviso(fm);

  initStorage();
})();

/* aggiornamento automatico: se su GitHub c'è una versione nuova dell'app, la ricarico da sola.
   La versione è nel tag <meta name="versione-app"> in alto: va cambiata a ogni modifica. */
(function(){
  try{
    var mia = (document.querySelector('meta[name="versione-app"]')||{}).content;
    if(!mia || !window.fetch || location.protocol.indexOf('http')!==0) return;
    var inCorso = false;
    function occupato(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
    function controlla(){
      if(inCorso || document.hidden) return;
      inCorso = true;
      fetch(location.pathname + '?c=' + Date.now(), { cache:'no-store' })
        .then(function(r){ return r.ok ? r.text() : ''; })
        .then(function(t){
          inCorso = false;
          var m = t && t.match(/<meta name="versione-app" content="([^"]+)"/);
          if(!m || m[1] === mia) return;
          if(occupato()) return;
          var chiave = 'agg_' + m[1];
          try{ if(sessionStorage.getItem(chiave)) return; sessionStorage.setItem(chiave, '1'); }catch(e){}
          try{ window.dispatchEvent(new Event('pagehide')); }catch(e){}
          setTimeout(function(){ location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])); }, 500);
        })
        .catch(function(){ inCorso = false; });
    }
    setTimeout(controlla, 1500);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(controlla, 700); });
    setInterval(controlla, 300000);
  }catch(e){}
})();
